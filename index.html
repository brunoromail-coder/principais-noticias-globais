                border-color: #262626;

        const apiKey = "AIzaSyBstOPDLkAENss2Jm4bMNQagzGyZiG6zc0";

        const userLanguage = navigator.language || navigator.userLanguage || (navigator.languages && navigator.languages[0]) || 'pt-BR';

        let exactUserDateTime = "";
        let detectedUserLocation = "";

        function getLiveTimestamp() {
            const nowOptions = { timeZone: userTimeZone, dateStyle: 'full', timeStyle: 'long' };
            return new Intl.DateTimeFormat(userLanguage, nowOptions).format(new Date());
        }

        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        async function displayStandardError(targetElement) {
            targetElement.innerHTML = `<span class="text-neutral-300 font-medium">Aconteceu um erro</span>`;
            await sleep(1000);
            targetElement.innerHTML = `<span class="text-neutral-400 font-medium">Verifique o funcionamento da internet e recarregue a página</span>`;
        }

        function base64ToArrayBuffer(base64) {
            const binaryString = atob(base64);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes.buffer;
        }

        function pcmToWav(pcm16, sampleRate) {
            const numChannels = 1;
            const byteRate = sampleRate * numChannels * 2;
            const blockAlign = numChannels * 2;
            const dataSize = pcm16.length * 2;
            const buffer = new ArrayBuffer(44 + dataSize);
            const view = new DataView(buffer);

            function writeString(view, offset, string) {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            }

            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + dataSize, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, byteRate, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, 16, true);
            writeString(view, 36, 'data');
            view.setUint32(40, dataSize, true);

            let offset = 44;
            for (let i = 0; i < pcm16.length; i++, offset += 2) {
                view.setInt16(offset, pcm16[i], true);
            }

            return new Blob([view], { type: 'audio/wav' });
        }

            'turquia': `<svg class="w-7 h-5 rounded-sm shadow-sm flex-shrink-0 object-cover" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#E30A17"/><circle cx="425" cy="400" r="200" fill="#fff"/><circle cx="475" cy="400" r="160" fill="#E30A17"/><polygon points="700,400 600,430 630,330 560,390 650,420" fill="#fff"/></svg>`
        };

        function getCountryFlagSvg(countryName) {
            const key = countryName.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '');
            for (const mapKey in flagSvgMap) {
                if (key.includes(mapKey)) {
                    return flagSvgMap[mapKey];
                }
            }
            let initials = "GV";
            const words = countryName.trim().split(/\s+/);
            if (words.length > 1) {
                initials = (words[0][0] + words[1][0]).toUpperCase();
            } else if (countryName.length >= 2) {
                initials = countryName.substring(0, 2).toUpperCase();
            }
            return `<div class="w-7 h-5 rounded-sm shadow-sm flex-shrink-0 bg-gradient-to-br from-neutral-800 to-black border border-neutral-700 flex items-center justify-center text-[10px] text-white font-bold tracking-tighter">${initials}</div>`;
        }

        async function fetchWithRetry(url, options, retries = 2, delayMs = 1000) {
            for (let i = 0; i <= retries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (response.ok) return response;
                    if (i === retries) throw new Error(`HTTP Error: ${response.status}`);
                } catch (err) {
                    if (i === retries) throw err;
                    await sleep(delayMs);
                }
            }
        }

        async function initializeApplicationData() {
            try {
                loadingText.textContent = "Detectando localidade...";
                await sleep(1000);

                detectedUserLocation = userTimeZone.replace('_', ' ');
                loadingText.textContent = `Localidade: ${detectedUserLocation}`;
                await sleep(1000);

                loadingText.textContent = "Detectando data e hora...";
                await sleep(1000);

                exactUserDateTime = getLiveTimestamp();
                loadingText.textContent = exactUserDateTime;
                await sleep(1000);

                const systemPromptCountries = `Você é um geógrafo e analista de dados globais operando em tempo real no exato momento '${getLiveTimestamp()}'. Retorne um JSON contendo um array 'countries' com a lista completa de todos os países soberanos reconhecidos do mundo, ordenados estritamente por PIB atualizado, traduzidos para o idioma '${userLanguage}'.`;
                const userQueryCountries = `lista de todos os países do mundo ordenada por PIB em tempo real em ${getLiveTimestamp()}`;

                const countriesPayload = {
                    contents: [{ parts: [{ text: userQueryCountries }] }],
                    tools: [{ "google_search": {} }],
                    systemInstruction: { parts: [{ text: systemPromptCountries }] },
                    generationConfig: {
                        responseMimeType: "application/json",
                        responseSchema: {
                            type: "OBJECT",
                            properties: {
                                countries: {
                                    type: "ARRAY",
                                    items: { type: "STRING" }
                                }
                            },
                            propertyOrdering: ["countries"]
                        }
                    }
                };

                const response = await fetchWithRetry(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(countriesPayload)
                });

                const result = await response.json();
                const candidate = result.candidates?.[0];
                let countryList = [
                    "Estados Unidos", "China", "Alemanha", "Japão", "Índia", "Reino Unido", "França", "Brasil", "Itália", "Canadá",
                    "Rússia", "México", "Austrália", "Coreia do Sul", "Espanha", "Indonésia", "Países Baixos", "Arábia Saudita", "Turquia", "Suíça"
                ];

                if (candidate && candidate.content?.parts?.[0]?.text) {
                    const parsed = JSON.parse(candidate.content.parts[0].text);
                    if (parsed.countries && parsed.countries.length > 0) {
                        countryList = parsed.countries;
                    }
                }

                loading.classList.add('hidden');

                for (let i = 0; i < countryList.length; i++) {
                    await fetchAndRenderCountry(countryList[i], i + 1);
                }

            } catch (error) {
                console.error(error);
                await displayStandardError(loadingText);
            }
        }

        async function fetchAndRenderCountry(countryName, rank) {
            const cardId = `country-card-${rank}`;
            const cardDiv = document.createElement('div');
            cardDiv.id = cardId;
            cardDiv.className = "ai-card rounded-2xl p-4 sm:p-6 shadow-xl border border-neutral-800 bg-gradient-to-b from-neutral-900 to-black animate-fade-in";
            cardDiv.innerHTML = `
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <div class="flex-shrink-0 flex items-center">${getCountryFlagSvg(countryName)}</div>
                        <span class="font-bold text-white text-sm sm:text-base tracking-wider truncate max-w-[180px] sm:max-w-none">${countryName.toUpperCase()}</span>
                    </div>
                    <div class="card-status flex items-center space-x-2 text-xs text-neutral-400">
                        <div class="w-3.5 h-3.5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                        <span class="font-medium tracking-wide hidden sm:inline text-neutral-300">Pesquisando fato mais popular agora...</span>
                    </div>
                </div>
            `;
            countriesContainer.appendChild(cardDiv);

            try {
                const currentRealtimeMoment = getLiveTimestamp();
                const specificQuery = `fato mais popular em ${countryName} em ${currentRealtimeMoment}`;

                const systemPromptAI = `Você é um motor de pesquisa de notícias e atualidades em tempo real de altíssima precisão. O usuário está localizado em '${detectedUserLocation}' (${userTimeZone}), com o carimbo de data e hora em tempo real: '${currentRealtimeMoment}' e idioma '${userLanguage}'. A pesquisa obrigatória a ser executada é: '${specificQuery}'. Retorne estritamente um JSON contendo: 'summary' (resumo de uma frase sobre o fato mais popular atual), 'paragraph' (parágrafo detalhado com palavras-chave em destaque) e 'topics' (array com objetos 'title' e 'description' sobre subtópicos recentes). Idioma: '${userLanguage}'.`;

                const aiPayload = {
                    contents: [{ parts: [{ text: specificQuery }] }],
                    tools: [{ "google_search": {} }],
                    systemInstruction: { parts: [{ text: systemPromptAI }] },
                    generationConfig: {
                        responseMimeType: "application/json",
                        responseSchema: {
                            type: "OBJECT",
                            properties: {
                                summary: { type: "STRING" },
                                paragraph: { type: "STRING" },
                                topics: {
                                    type: "ARRAY",
                                    items: {
                                        type: "OBJECT",
                                        properties: {
                                            title: { type: "STRING" },
                                            description: { type: "STRING" }
                                        },
                                        propertyOrdering: ["title", "description"]
                                    }
                                }
                            },
                            propertyOrdering: ["summary", "paragraph", "topics"]
                        }
                    }
                };

                const aiResponse = await fetchWithRetry(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(aiPayload)
                });

                const aiResult = await aiResponse.json();
                const aiCandidate = aiResult.candidates?.[0];

                if (aiCandidate && aiCandidate.content?.parts?.[0]?.text) {
                    const data = JSON.parse(aiCandidate.content.parts[0].text);

                    const formatText = (text) => {
                        if (!text) return '';
                        return text
                            .replace(/\*\*(.*?)\*\*/g, '<strong class="text-white font-bold">$1</strong>')
                            .replace(/\*(.*?)\*/g, '<em class="not-italic text-neutral-300">$1</em>');
                    };

                    const cleanSummary = formatText(data.summary);
                    const cleanParagraph = formatText(data.paragraph);
                    const lastGeneratedText = `${data.paragraph} ${data.topics.map(t => t.title + ' ' + t.description).join(' ')}`.replace(/\*\*/g, '');

                    let sources = [];
                    const groundingMetadata = aiCandidate.groundingMetadata;
                    if (groundingMetadata && groundingMetadata.groundingAttributions) {
                        sources = groundingMetadata.groundingAttributions
                            .map(attr => ({
                                uri: attr.web?.uri,
                                title: attr.web?.title
                            }))
                            .filter(s => s.uri && s.title);
                    }

                    let sourcesHtml = `<span class="text-neutral-400 font-medium">Fontes:</span>`;
                    if (sources.length > 0) {
                        sources.slice(0, 2).forEach(src => {
                            const domain = new URL(src.uri).hostname.replace('www.', '');
                            sourcesHtml += `<a href="${src.uri}" target="_blank" rel="noopener noreferrer" class="bg-black hover:bg-neutral-800 border border-neutral-700 px-3 py-1 rounded-md text-white transition-colors flex items-center space-x-1" onclick="event.stopPropagation()"><span>${domain}</span></a>`;
                        });
                    } else {
                        sourcesHtml += `<span class="text-neutral-400">Google Search Grounding</span>`;
                    }

                    cardDiv.className = "ai-card rounded-2xl p-4 sm:p-6 shadow-xl cursor-pointer transition-all duration-300 hover:border-neutral-500 select-none animate-fade-in";
                    cardDiv.innerHTML = `
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-3">
                                <div class="flex-shrink-0 flex items-center">${getCountryFlagSvg(countryName)}</div>
                                <span class="font-bold text-white text-sm sm:text-base tracking-wider truncate max-w-[180px] sm:max-w-none">${countryName.toUpperCase()}</span>
                            </div>
                            <div class="flex items-center space-x-2 sm:space-x-3">
                                <button class="tts-btn p-2 hover:bg-neutral-800 rounded-full text-white transition-colors cursor-pointer hidden touch-manipulation" title="Ouvir Resumo" data-text="${encodeURIComponent(lastGeneratedText)}">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
                                    </svg>
                                </button>
                                <svg class="chevron-icon w-5 h-5 text-neutral-400 transition-transform duration-300 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                </svg>
                            </div>
                        </div>

                        <div class="short-summary mt-3 text-neutral-300 text-sm sm:text-base leading-relaxed">
                            ${cleanSummary}
                        </div>

                        <div class="expanded-content hidden mt-5 pt-5 border-t border-neutral-800 space-y-4">
                            <div class="flex items-center space-x-2">
                                <span class="text-xs uppercase tracking-widest text-white font-bold">Visão geral criada por IA</span>
                            </div>
                            
                            <div class="space-y-4 text-neutral-300 text-sm sm:text-base leading-relaxed">
                                <p class="text-neutral-200 leading-relaxed">${cleanParagraph}</p>
                                <ul class="space-y-3.5 mt-4">
                                    ${data.topics.map(t => `
                                        <li class="flex items-start space-x-3">
                                            <span class="inline-block w-1.5 h-1.5 rounded-full bg-white mt-2 shrink-0"></span>
                                            <div class="leading-relaxed">
                                                <strong class="text-white font-bold">${formatText(t.title)}</strong> 
                                                <span class="text-neutral-300">${formatText(t.description)}</span>
                                            </div>
                                        </li>
                                    `).join('')}
                                </ul>
                            </div>

                            <div class="mt-6 pt-4 border-t border-neutral-800 flex flex-wrap items-center justify-between gap-3 text-xs text-neutral-400">
                                <div class="flex flex-wrap items-center gap-3">
                                    ${sourcesHtml}
                                </div>
                            </div>
                        </div>
                    `;

                    const ttsBtn = cardDiv.querySelector('.tts-btn');
                    const chevron = cardDiv.querySelector('.chevron-icon');
                    const expanded = cardDiv.querySelector('.expanded-content');
                    let isExpanded = false;

                    cardDiv.addEventListener('click', () => {
                        isExpanded = !isExpanded;
                        if (isExpanded) {
                            expanded.classList.remove('hidden');
                            chevron.classList.add('rotate-180');
                            ttsBtn.classList.remove('hidden');
                        } else {
                            expanded.classList.add('hidden');
                            chevron.classList.remove('rotate-180');
                            ttsBtn.classList.add('hidden');
                        }
                    });

                    ttsBtn.addEventListener('click', async (e) => {
                        e.stopPropagation();
                        ttsBtn.classList.add('animate-pulse', 'text-white');
                        try {
                            const textToRead = decodeURIComponent(ttsBtn.getAttribute('data-text'));
                            const ttsPayload = {
                                contents: [{ parts: [{ text: `Leia de forma informativa: ${textToRead}` }] }],
                                generationConfig: {
                                    responseModalities: ["AUDIO"],
                                    speechConfig: {
                                        voiceConfig: { prebuiltVoiceConfig: { voiceName: "Charon" } }
                                    }
                                },
                                model: "gemini-2.5-flash-preview-tts"
                            };

                            const ttsUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;
                            const resp = await fetchWithRetry(ttsUrl, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(ttsPayload)
                            });

                            const resJson = await resp.json();
                            const part = resJson?.candidates?.[0]?.content?.parts?.[0];
                            const audioData = part?.inlineData?.data;
                            const mimeType = part?.inlineData?.mimeType;

                            if (audioData && mimeType && mimeType.startsWith("audio/")) {
                                const sampleRateMatch = mimeType.match(/rate=(\d+)/);
                                const sampleRate = sampleRateMatch ? parseInt(sampleRateMatch[1], 10) : 24000;
                                const pcmData = base64ToArrayBuffer(audioData);
                                const pcm16 = new Int16Array(pcmData);
                                const wavBlob = pcmToWav(pcm16, sampleRate);
                                const audioUrl = URL.createObjectURL(wavBlob);
                                
                                const audio = new Audio(audioUrl);
                                audio.onended = () => ttsBtn.classList.remove('animate-pulse', 'text-white');
                                audio.play();
                            } else {
                                ttsBtn.classList.remove('animate-pulse', 'text-white');
                            }
                        } catch (err) {
                            console.error(err);
                            ttsBtn.classList.remove('animate-pulse', 'text-white');
                        }
                    });

                } else {
                    const statusEl = cardDiv.querySelector('.card-status');
                    if (statusEl) await displayStandardError(statusEl);
                    else cardDiv.innerHTML = `<div class="p-4 text-neutral-300 text-sm">Aconteceu um erro<br><span class="text-xs text-neutral-400">Verifique o funcionamento da internet e recarregue a página</span></div>`;
                }
            } catch (err) {
                console.error(err);
                const statusEl = cardDiv.querySelector('.card-status');
                if (statusEl) await displayStandardError(statusEl);
                else cardDiv.innerHTML = `<div class="p-4 text-neutral-300 text-sm">Aconteceu um erro<br><span class="text-xs text-neutral-400">Verifique o funcionamento da internet e recarregue a página</span></div>`;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initializeApplicationData();
        });
    </script>
</body>
</html>
