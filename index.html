<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, minimum-scale=1.0">
    <title>Principais Notícias Globais Agora</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            -webkit-text-size-adjust: 100%;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }
        .ai-card {
            background: linear-gradient(180deg, #121212 0%, #050505 100%);
            border: 1px solid #262626;
            transition: border-color 0.25s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.25s cubic-bezier(0.4, 0, 0.2, 1), background 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform, border-color;
            transform: translateZ(0);
        }
        .ai-card:hover {
            border-color: #525252;
            background: linear-gradient(180deg, #181818 0%, #0a0a0a 100%);
            box-shadow: 0 4px 24px rgba(255, 255, 255, 0.05);
        }
        @media (hover: none) {
            .ai-card:hover {
                border-color: #262626;
                box-shadow: none;
            }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased selection:bg-white selection:text-black">

    <!-- Header com Gerenciamento de Chave API pelo Usuário -->
    <header class="w-full max-w-4xl mx-auto px-3 sm:px-6 md:px-8 pt-6 flex justify-between items-center">
        <h1 class="text-xs uppercase tracking-widest text-neutral-400 font-semibold">Notícias em Tempo Real</h1>
        <button id="configKeyBtn" class="text-xs text-neutral-400 hover:text-white border border-neutral-800 hover:border-neutral-600 px-3 py-1.5 rounded-lg transition-colors flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path></svg>
            <span id="keyBtnText">Configurar Chave API</span>
        </button>
    </header>

    <!-- Modal de Configuração da Chave API -->
    <div id="apiModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-neutral-900 border border-neutral-800 rounded-2xl p-6 max-w-md w-full space-y-4 shadow-2xl">
            <h2 class="text-lg font-bold text-white">Insira sua Chave da API Gemini</h2>
            <p class="text-xs text-neutral-400 leading-relaxed">
                Para carregar notícias em tempo real sem expor dados globais, insira sua chave gratuita do Google AI Studio. Ela fica salva de forma 100% privada e segura no seu próprio navegador.
            </p>
            <div>
                <input type="password" id="apiKeyInput" placeholder="AIzaSy..." class="w-full bg-black border border-neutral-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-white transition-colors">
            </div>
            <div class="flex justify-end space-x-2 pt-2">
                <button id="cancelModalBtn" class="px-4 py-2 text-xs font-medium text-neutral-400 hover:text-white transition-colors">Cancelar</button>
                <button id="saveKeyBtn" class="px-4 py-2 bg-white text-black font-semibold text-xs rounded-xl hover:bg-neutral-200 transition-colors">Salvar e Carregar</button>
            </div>
        </div>
    </div>

    <!-- Container Principal -->
    <main class="w-full max-w-4xl mx-auto px-3 sm:px-6 md:px-8 py-6 sm:py-10 flex-grow">
        
        <!-- Indicador de Carregamento Sequencial -->
        <div id="loading" class="flex flex-col items-center justify-center py-16 space-y-4">
            <div class="relative">
                <div class="w-12 h-12 rounded-full border-2 border-white/10"></div>
                <div class="w-12 h-12 rounded-full border-2 border-white border-t-transparent animate-spin absolute inset-0"></div>
            </div>
            <p id="loadingText" class="text-xs sm:text-sm font-medium text-neutral-400 tracking-wide text-center px-4 transition-all duration-300">Aguardando chave de API...</p>
        </div>

        <!-- Grid de Cards de Países -->
        <div id="countriesContainer" class="grid grid-cols-1 gap-4 sm:gap-6">
            <!-- Cards gerados dinamicamente em tempo real -->
        </div>

    </main>

    <script>
        const loading = document.getElementById('loading');
        const loadingText = document.getElementById('loadingText');
        const countriesContainer = document.getElementById('countriesContainer');
        const apiModal = document.getElementById('apiModal');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const configKeyBtn = document.getElementById('configKeyBtn');
        const keyBtnText = document.getElementById('keyBtnText');
        const saveKeyBtn = document.getElementById('saveKeyBtn');
        const cancelModalBtn = document.getElementById('cancelModalBtn');

        let userApiKey = localStorage.getItem('gemini_user_api_key') || "";

        const userLanguage = navigator.language || navigator.userLanguage || 'pt-BR';
        const userTimeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';

        let exactUserDateTime = "";
        let detectedUserLocation = "";

        function updateKeyBtnUI() {
            if (userApiKey) {
                keyBtnText.textContent = "Chave Configurada";
                configKeyBtn.classList.add('border-emerald-500/50', 'text-emerald-400');
            } else {
                keyBtnText.textContent = "Inserir Chave API";
                configKeyBtn.classList.remove('border-emerald-500/50', 'text-emerald-400');
            }
        }

        configKeyBtn.addEventListener('click', () => {
            apiKeyInput.value = userApiKey;
            apiModal.classList.remove('hidden');
        });

        cancelModalBtn.addEventListener('click', () => {
            apiModal.classList.add('hidden');
        });

        saveKeyBtn.addEventListener('click', () => {
            const val = apiKeyInput.value.trim();
            if (val) {
                userApiKey = val;
                localStorage.setItem('gemini_user_api_key', val);
                updateKeyBtnUI();
                apiModal.classList.add('hidden');
                countriesContainer.innerHTML = '';
                loading.classList.remove('hidden');
                initializeApplicationData();
            }
        });

        function getLiveTimestamp() {
            const nowOptions = { timeZone: userTimeZone, dateStyle: 'full', timeStyle: 'long' };
            return new Intl.DateTimeFormat(userLanguage, nowOptions).format(new Date());
        }

        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        async function displayStandardError(targetElement) {
            targetElement.innerHTML = `<span class="text-white font-medium">Aconteceu um erro</span>`;
            await sleep(1000);
            targetElement.innerHTML = `<span class="text-neutral-400 font-medium">Verifique a chave informada ou sua conexão com a internet e recarregue a página</span>`;
        }

        const flagSvgMap = {
            'estadosunidos': `<svg class="w-7 h-5 rounded-sm shadow-sm flex-shrink-0 object-cover" viewBox="0 0 1900 1000"><rect width="1900" height="1000" fill="#b22234"/><path d="M0,0h1900v76.9h-1900z M0,153.8h1900v76.9h-1900z M0,307.7H1900v76.9H0z M0,461.5H1900v76.9H0z M0,615.4H1900v76.9H0z M0,769.2H1900v76.9H0z M0,923.1H1900v76.9H0z" fill="#fff"/><rect width="760" height="538.5" fill="#3c3b6e"/></svg>`,
            'china': `<svg class="w-7 h-5 rounded-sm shadow-sm flex-shrink-0 object-cover" viewBox="0 0 900 600"><rect width="900" height="600" fill="#ee1c25"/><polygon points="150,60 179,150 255,95 208,181 297,210 208,239 255,325 179,270 150,360 121,270 45,325 92,239 3,210 92,181 45,95 121,150" fill="#ffde00"/></svg>`,
            'japao': `<svg class="w-7 h-5 rounded-sm shadow-sm flex-shrink-0 object-cover border border-neutral-700" viewBox="0 0 900 600"><rect width="900" height="600" fill="#fff"/><circle cx="450" cy="300" r="180" fill="#bc002d"/></svg>`,
            'coreiadosul': `<svg class="w-7 h-5 rounded-sm shadow-sm flex-shrink-0 object-cover border border-neutral-700" viewBox="0 0 72 48" fill="none"><rect width="72" height="48" fill="white"/><g transform="translate(36,24) rotate(-33.69)"><path d="M 0,-12 A 12 12 0 0 1 0,12 A 6 6 0 0 1 0,0 A 6 6 0 0 0 0,-12" fill="#CD2E3A"/><path d="M 0,12 A 12 12 0 0 1 0,-12 A 6 6 0 0 1 0,0 A 6 6 0 0 0 0,12" fill="#0047A0"/></g><g stroke="#111" stroke-width="1.5"><line x1="14" y1="11" x2="22" y2="6"/><line x1="16" y1="14" x2="24" y2="9"/><line x1="18" y1="17" x2="26" y2="12"/><line x1="46" y1="36" x2="50" y2="33.5"/><line x1="52" y1="32" x2="56" y2="29.5"/><line x1="48" y1="39" x2="52" y2="36.5"/><line x1="54" y1="35" x2="58" y2="32.5"/><line x1="50" y1="42" x2="54" y2="39.5"/><line x1="56" y1="38" x2="60" y2="35.5"/><line x1="50" y1="6" x2="58" y2="11"/><line x1="48" y1="9" x2="52" y2="11.5"/><line x1="54" y1="12.7" x2="56" y2="14"/><line x1="46" y1="12" x2="54" y2="17"/><line x1="18" y1="36" x2="26" y2="41"/><line x1="18" y1="33" x2="20" y2="34.2"/><line x1="22" y1="35.5" x2="24" y2="36.7"/><line x1="14" y1="30" x2="22" y2="35"/></g></svg>`,
            'alemanha': `<svg class="w-7 h-5 rounded-sm shadow-sm flex-shrink-0 object-cover" viewBox="0 0 5 3"><rect width="5" height="3" fill="#000"/><rect y="1" width="5" height="1" fill="#D00"/><rect y="2" width="5" height="1" fill="#FFCE00"/></svg>`,
            'india': `<svg class="w-7 h-5 rounded-sm shadow-sm flex-shrink-0 object-cover" viewBox="0 0 900 600"><rect width="900" height="200" fill="#ff9933"/><rect y="200" width="900" height="200" fill="#fff"/><rect y="400" width="900" height="200" fill="#138808"/><circle cx="450" cy="300" r="40" fill="none" stroke="#000080" stroke-width="6"/></svg>`,
            'reinounido': `<svg class="w-7 h-5 rounded-sm shadow-sm flex-shrink-0 object-cover" viewBox="0 0 60 30"><rect width="60" height="30" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#C8102E" stroke-width="4"/><path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></svg>`,
            'franca': `<svg class="w-7 h-5 rounded-sm shadow-sm flex-shrink-0 object-cover" viewBox="0 0 900 600"><rect width="300" height="600" fill="#0055a5"/><rect x="300" width="300" height="600" fill="#fff"/><rect x="600" width="300" height="600" fill="#ef4135"/></svg>`,
            'brasil': `<svg class="w-7 h-5 rounded-sm shadow-sm flex-shrink-0 object-cover" viewBox="0 0 1000 700"><rect width="1000" height="700" fill="#009b3a"/><polygon points="500,50 950,350 500,650 50,350" fill="#fedf00"/><circle cx="500" cy="350" r="175" fill="#002776"/></svg>`
        };

        function getCountryFlagSvg(countryName) {
            const key = countryName.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '');
            for (const mapKey in flagSvgMap) {
                if (key.includes(mapKey)) return flagSvgMap[mapKey];
            }
            const initials = countryName.substring(0, 2).toUpperCase();
            return `<div class="w-7 h-5 rounded-sm shadow-sm flex-shrink-0 bg-neutral-800 border border-neutral-700 flex items-center justify-center text-[10px] text-white font-bold">${initials}</div>`;
        }

        async function initializeApplicationData() {
            updateKeyBtnUI();

            if (!userApiKey) {
                loadingText.textContent = "Por favor, insira sua chave no botão no topo superior direito para carregar as notícias.";
                apiModal.classList.remove('hidden');
                return;
            }

            try {
                loadingText.textContent = "Detectando localidade...";
                await sleep(600);

                detectedUserLocation = userTimeZone.replace('_', ' ');
                loadingText.textContent = `Localidade: ${detectedUserLocation}`;
                await sleep(600);

                loadingText.textContent = "Detectando data e hora...";
                await sleep(600);

                exactUserDateTime = getLiveTimestamp();
                loadingText.textContent = exactUserDateTime;
                await sleep(600);

                const defaultCountries = [
                    "Estados Unidos", "China", "Alemanha", "Japão", "Índia", 
                    "Reino Unido", "França", "Brasil", "Coreia do Sul"
                ];

                loading.classList.add('hidden');

                for (let i = 0; i < defaultCountries.length; i++) {
                    await fetchAndRenderCountry(defaultCountries[i], i + 1);
                }

            } catch (error) {
                console.error(error);
                await displayStandardError(loadingText);
            }
        }

        async function fetchAndRenderCountry(countryName, rank) {
            const cardId = `country-card-${rank}`;
            const cardDiv = document.createElement('div');
            cardDiv.id = cardId;
            cardDiv.className = "ai-card rounded-2xl p-4 sm:p-6 shadow-xl border border-neutral-800 bg-gradient-to-b from-neutral-900 to-black animate-fade-in";
            cardDiv.innerHTML = `
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <div class="flex-shrink-0 flex items-center">${getCountryFlagSvg(countryName)}</div>
                        <span class="font-bold text-white text-sm sm:text-base tracking-wider truncate max-w-[180px] sm:max-w-none">${countryName.toUpperCase()}</span>
                    </div>
                    <div class="card-status flex items-center space-x-2 text-xs text-neutral-400">
                        <div class="w-3.5 h-3.5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                        <span class="font-medium tracking-wide text-neutral-300">Pesquisando fato mais popular agora...</span>
                    </div>
                </div>
            `;
            countriesContainer.appendChild(cardDiv);

            const cardStatusContainer = cardDiv.querySelector('.card-status');

            try {
                const currentRealtimeMoment = getLiveTimestamp();
                const prompt = `Responda no formato JSON com as chaves "summary", "paragraph" e "topics" (array com objetos contendo "title" e "description"). Fato mais recente e popular em ${countryName} na data ${currentRealtimeMoment}. Idioma: ${userLanguage}.`;

                const aiPayload = {
                    contents: [{
                        parts: [{ text: prompt }]
                    }]
                };

                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${userApiKey.trim()}`;

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(aiPayload)
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const aiResult = await response.json();
                const rawText = aiResult.candidates?.[0]?.content?.parts?.[0]?.text || "";
                
                const jsonMatch = rawText.match(/\{[\s\S]*\}/);
                if (!jsonMatch) throw new Error("JSON não encontrado na resposta");

                const data = JSON.parse(jsonMatch[0]);

                const formatText = (text) => {
                    if (!text) return '';
                    return text
                        .replace(/\*\*(.*?)\*\*/g, '<strong class="text-white font-bold">$1</strong>')
                        .replace(/\*(.*?)\*/g, '<em class="not-italic text-neutral-300">$1</em>');
                };

                const cleanSummary = formatText(data.summary);
                const cleanParagraph = formatText(data.paragraph);

                cardDiv.className = "ai-card rounded-2xl p-4 sm:p-6 shadow-xl cursor-pointer transition-all duration-300 hover:border-neutral-500 select-none animate-fade-in";
                cardDiv.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <div class="flex-shrink-0 flex items-center">${getCountryFlagSvg(countryName)}</div>
                            <span class="font-bold text-white text-sm sm:text-base tracking-wider truncate max-w-[180px] sm:max-w-none">${countryName.toUpperCase()}</span>
                        </div>
                        <div class="flex items-center space-x-2 sm:space-x-3">
                            <svg class="chevron-icon w-5 h-5 text-neutral-400 transition-transform duration-300 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                            </svg>
                        </div>
                    </div>

                    <div class="short-summary mt-3 text-neutral-300 text-sm sm:text-base leading-relaxed">
                        ${cleanSummary}
                    </div>

                    <div class="expanded-content hidden mt-5 pt-5 border-t border-neutral-800 space-y-4">
                        <div class="flex items-center space-x-2">
                            <span class="text-xs uppercase tracking-widest text-white font-bold">Visão geral criada por IA</span>
                        </div>
                        
                        <div class="space-y-4 text-neutral-300 text-sm sm:text-base leading-relaxed">
                            <p class="text-neutral-200 leading-relaxed">${cleanParagraph}</p>
                            <ul class="space-y-3.5 mt-4">
                                ${(data.topics || []).map(t => `
                                    <li class="flex items-start space-x-3">
                                        <span class="inline-block w-1.5 h-1.5 rounded-full bg-white mt-2 shrink-0"></span>
                                        <div class="leading-relaxed">
                                            <strong class="text-white font-bold">${formatText(t.title)}</strong> 
                                            <span class="text-neutral-300">${formatText(t.description)}</span>
                                        </div>
                                    </li>
                                `).join('')}
                            </ul>
                        </div>
                    </div>
                `;

                const chevron = cardDiv.querySelector('.chevron-icon');
                const expanded = cardDiv.querySelector('.expanded-content');
                let isExpanded = false;

                cardDiv.addEventListener('click', () => {
                    isExpanded = !isExpanded;
                    if (isExpanded) {
                        expanded.classList.remove('hidden');
                        chevron.classList.add('rotate-180');
                    } else {
                        expanded.classList.add('hidden');
                        chevron.classList.remove('rotate-180');
                    }
                });

            } catch (err) {
                console.error(`Erro ao consultar ${countryName}:`, err);
                await displayStandardError(cardStatusContainer);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initializeApplicationData();
        });
    </script>
</body>
</html>
